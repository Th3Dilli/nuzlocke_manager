server {
    server_name pokemon.example.dev;
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pokemon.example.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pokemon.example.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


    # Matches /api/stats/<any-username>/stream
    location ~ ^/api/(soullink|nuzlocke)(/public)?/[^/]+/stream$ {
        proxy_pass http://localhost:3003;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://localhost:3003;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        # buffering stays on (default) — fast normal page loads
    }

    access_log /var/log/nginx/pokemon.access.log;
}

server {
    if ($host = pokemon.example.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name pokemon.example.dev;
    return 404; # managed by Certbot
}